name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Análisis estático (ruff)
        run: ruff check telegram_uploader subir_a_telegram.py herramientas
        continue-on-error: true  # deuda conocida: 8 hallazgos pendientes (ver ARQUITECTURA.md, sección 8)

      - name: Pruebas (pytest)
        run: python -m pytest -q