line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "BLE", "S", "C90", "PLR", "PLW", "SLF", "ASYNC"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# Los textos de la interfaz son datos, no lógica: partirlos en varias líneas los vuelve ilegibles.
"telegram_uploader/i18n.py" = ["E501"]
# Las pruebas usan assert y archivos temporales por diseño.
"test/*" = ["S101", "S603", "ASYNC240", "ASYNC230"]
